name: kekeweb

x-api: &api
  build:
    context: .
    dockerfile: deploy/api.Dockerfile
  env_file:
    - .env.production
  restart: unless-stopped
  depends_on:
    database:
      condition: service_healthy
  volumes:
    - api-storage:/var/www/html/storage

services:
  edge:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      api-web:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  api-web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./backend/public:/var/www/html/public:ro
      - ./deploy/nginx-api.conf:/etc/nginx/conf.d/default.conf:ro

  api:
    <<: *api
    command:
      - /bin/sh
      - -lc
      - >-
        prepare-storage &&
        php artisan migrate --force &&
        php artisan db:seed --force &&
        php artisan optimize &&
        php-fpm -F

  worker:
    <<: *api
    command:
      - /bin/sh
      - -lc
      - >-
        prepare-storage &&
        php artisan queue:work --sleep=3 --tries=3 --timeout=90

  scheduler:
    <<: *api
    command:
      - /bin/sh
      - -lc
      - >-
        prepare-storage &&
        php artisan schedule:work

  database:
    image: mariadb:11.8
    restart: unless-stopped
    env_file:
      - .env.production
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - mariadb-data:/var/lib/mysql

volumes:
  api-storage:
  caddy-config:
  caddy-data:
  mariadb-data:
